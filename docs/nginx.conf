# Nginx configuration for Bayu CCTV
# Copy to: /www/wwwroot/bintangsecure.com/nginx.conf
# Or paste into aaPanel/BT Panel → Website → bintangsecure.com → Config

server {
    listen 80;
    server_name bintangsecure.com;
    root /www/wwwroot/bintangsecure.com/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to storage folder
    location ~* /storage/ {
        deny all;
        return 404;
    }
}
